[package]
name = "dbunk"
version = "0.1.0-alpha.1"
description = "Open-source desktop database workspace for exploring data, running SQL, and inspecting schemas."
authors = ["Imran"]
license = "MIT"
repository = "https://github.com/imran-vz/dbunk"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dbunk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dbunk"
path = "src/main.rs"
required-features = ["tauri-host"]

[features]
default = ["tauri-host"]
# The Tauri desktop host: command adapters, plugins and the entry point.
# Without it the crate is the host-neutral backend, with no Tauri in its
# dependency graph. `just lint` and `just test` build both ways (ADR-0032).
tauri-host = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-log",
    "dep:tauri-plugin-window-state",
    "dep:objc2-app-kit",
]
# Honors DBUNK_DEV_CONFIG_DIR in optimized builds, for measurement runs
# against a disposable profile. Never enabled in a release artefact.
isolated-profile = []

[build-dependencies]
tauri-build = { version = "2.4", features = [], optional = true }

[dependencies]
tauri = { version = "2.11", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", features = ["any", "mysql", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "sqlite", "chrono", "uuid"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
redis = { version = "0.27", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "tls-rustls-insecure"] }
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }
once_cell = "1"
# `rt-multi-thread`: the SSH tunnel uses `block_in_place`, so the host must
# supply a multi-thread runtime. Tauri used to enable this feature for us.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "process", "fs", "io-util"] }
futures-core = "0.3"
futures-util = "0.3"
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "=0.14.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.7"
rustls-pki-types = "1"
tempfile = "3"
calamine = "0.26"
rust_xlsxwriter = "0.84"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_IO"] }

[dev-dependencies]
serialize-to-javascript = "=0.1.2"
tokio = { version = "1", features = ["macros", "rt"] }
serial_test = "3"
