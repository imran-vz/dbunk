name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build native macOS DMG (arm64, unsigned)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Verify tag matches crate versions
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          backend_version=$(grep -m1 '^version' backend/Cargo.toml | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          if [ "$tag_version" != "$backend_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match backend/Cargo.toml version ${backend_version}"
            exit 1
          fi
          echo "Versions in sync: ${tag_version}"

      - name: Package and verify DMG
        id: dmg
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bundle"
          python3 tools/native/package.py --out "$out"
          dmg="$RUNNER_TEMP/dbunk-${GITHUB_REF_NAME}-arm64.dmg"
          python3 tools/native/dmg.py --bundle-dir "$out" --image "$dmg" --applications "$RUNNER_TEMP/Applications"
          echo "dmg_path=${dmg}" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$(basename "${dmg}")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          draft: false
          generate_release_notes: true
          files: ${{ steps.dmg.outputs.dmg_path }}
          body: |
            ## dbunk ${{ github.ref_name }} — pre-alpha

            ⚠️ **dbunk is pre-alpha and under heavy development.** Expect breakage and breaking changes. Do not point this at production databases.

            ### Install (macOS, Apple Silicon)

            1. Download `${{ steps.dmg.outputs.dmg_name }}` from the assets below.
            2. Open the DMG and drag the app into Applications.
            3. The build is unsigned: right-click the app → **Open**, or run `xattr -dr com.apple.quarantine` on it.
