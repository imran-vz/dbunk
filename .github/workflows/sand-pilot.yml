# Temporary diagnostic workflow; publication requires operator confirmation.
# No push/PR trigger, checkout, repository code execution or referenced secrets.
name: Sand pilot smoke

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Lifecycle scenario (failure intentionally exits 42; cancel waits for cancellation)
        required: true
        default: seed
        type: choice
        options: [seed, clean, failure, cancel]

permissions: {}

concurrency:
  group: dbunk-sand-pilot-smoke
  cancel-in-progress: false

jobs:
  pilot:
    if: ${{ github.actor == 'imran-vz' }}
    runs-on: [self-hosted, Linux, ARM64, homeserver, docker, sand]
    timeout-minutes: 10
    env:
      PILOT_SCENARIO: ${{ inputs.scenario }}
    steps:
      - name: Verify clean ARM64 guest and Docker
        shell: bash
        run: |
          set -Eeuo pipefail
          uname -sm
          id
          printf 'Runner: %s\n' "$RUNNER_NAME"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(id -u)" -ne 0
          test ! -e "$HOME/.dbunk-sand-job-sentinel"
          docker info >/dev/null
          docker compose version
          docker run --rm --platform linux/arm64 \
            alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 \
            sh -ec 'test "$(uname -m)" = aarch64'
      - name: Exercise lifecycle scenario
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$PILOT_SCENARIO" in
            seed)
              printf '%s\n' "$RUNNER_NAME" > "$HOME/.dbunk-sand-job-sentinel"
              test -s "$HOME/.dbunk-sand-job-sentinel"
              ;;
            clean)
              test ! -e "$HOME/.dbunk-sand-job-sentinel"
              printf '%s\n' 'No sentinel from the previous VM.'
              ;;
            failure)
              printf '%s\n' 'Intentional failure for slot-recovery validation.'
              exit 42
              ;;
            cancel)
              printf '%s\n' 'Ready for operator-approved cancellation.'
              sleep 300
              ;;
            *) exit 64 ;;
          esac
