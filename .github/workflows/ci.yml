name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "**/*.md"
      - designs/**
      - marketing/**
  pull_request:
    branches: [main]
    paths-ignore: *docs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (test)
    runs-on: [self-hosted, Linux, ARM64, homeserver, docker, sand]
    # Credential tests still share the legacy AES key/password cache (Plan 027).
    env:
      RUST_TEST_THREADS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # rustup-init edits shell profiles by default, and the Docker runner's
      # ~/.profile is not writable. Install it without that edit; the
      # toolchain action then finds rustup and only selects the toolchain.
      - name: Install rustup
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$cargo_home/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --no-modify-path -y
          fi
          echo "$cargo_home/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache here: on this self-hosted runner the GitHub cache moves at
      # ~3 MB/s, so restoring (~2-4 min) and saving (~4 min) the 640 MB target
      # cost far more than the ~30 s of dependency compilation it saves.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
      # fmt and clippy run in lint.yml.
      - run: cargo test
      - run: cargo test --features isolated-profile

  native:
    name: Native macOS (dev tests)
    runs-on: macos-15
    env:
      RUST_TEST_THREADS: "1"
      # Backtraces keep file:line; full debuginfo only grows the cache and link.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # fmt and clippy run in lint.yml.
      - run: cargo test --locked
      - run: python3 ../../tools/native/dependencies.py
      - run: python3 -m unittest discover -s ../../tools/native -p 'test_*.py'
      # Interactive AX, VoiceOver and PostgreSQL E2E remain explicit fixture gates.

  native-release:
    name: Native macOS (release tests + bundle)
    runs-on: macos-15
    env:
      RUST_TEST_THREADS: "1"
      # The shipping profile (thin LTO, codegen-units = 1) serialises codegen of
      # dbunk-native and took ~20 min per release build on this runner. CI keeps
      # opt-level 3 and release semantics but parallel codegen without LTO;
      # release.yml still builds the shipping profile.
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "false"
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --release --locked
      - run: python3 ../../tools/native/package.py --out "$RUNNER_TEMP/ci-bundle"
