name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (fmt + clippy + test)
    runs-on: [self-hosted, Linux, ARM64, homeserver, docker, sand]
    # Credential tests still share the legacy AES key/password cache (Plan 027).
    env:
      RUST_TEST_THREADS: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # rustup-init edits shell profiles by default, and the Docker runner's
      # ~/.profile is not writable. Install it without that edit; the
      # toolchain action then finds rustup and only selects the toolchain.
      - name: Install rustup
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$cargo_home/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --no-modify-path -y
          fi
          echo "$cargo_home/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo clippy --features isolated-profile --all-targets -- -D warnings
      - run: cargo test --features isolated-profile

  native:
    name: Native macOS (pinned GPUI checks)
    runs-on: macos-15
    env:
      RUST_TEST_THREADS: "1"
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --features fixture-verification --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
      - run: python3 ../../tools/native/dependencies.py
      - run: python3 -m unittest discover -s ../../tools/native -p 'test_*.py'
      - run: python3 ../../tools/native/package.py --out "$RUNNER_TEMP/ci-bundle"
      # Interactive AX, VoiceOver and PostgreSQL E2E remain explicit fixture gates.
