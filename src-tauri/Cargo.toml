[package]
name = "dbunk"
version = "0.1.0-alpha.1"
description = "Open-source desktop database workspace for exploring data, running SQL, and inspecting schemas."
authors = ["Imran"]
license = "MIT"
repository = "https://github.com/imran-vz/dbunk"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dbunk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", features = ["any", "mysql", "postgres", "runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
redis = { version = "0.27", default-features = false, features = ["tokio-rustls-comp", "connection-manager", "tls-rustls-insecure"] }
once_cell = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
futures-core = "0.3"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
serial_test = "3"
