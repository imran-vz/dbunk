name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + test)
    runs-on: [self-hosted, Linux, ARM64, homeserver, docker, orbstack]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential python3
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm run check:slice-isolation
      - run: pnpm run check:redis-commands
      - run: pnpm run check:ui-gates

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: [self-hosted, Linux, ARM64, homeserver, docker, orbstack]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      # rustup-init edits shell profiles by default, and the Docker runner's
      # ~/.profile is not writable. Install it without that edit; the
      # toolchain action then finds rustup and only selects the toolchain.
      - name: Install rustup
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$cargo_home/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --no-modify-path -y
          fi
          echo "$cargo_home/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: cargo fmt -- --check
      # The backend without the Tauri host: nothing below the command layer
      # may depend on Tauri (ADR-0032).
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo test --no-default-features
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  native:
    name: Native macOS (pinned GPUI checks)
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - run: cargo clippy --manifest-path ../../src-tauri/Cargo.toml --no-default-features --features isolated-profile --all-targets -- -D warnings
      - run: cargo test --manifest-path ../../src-tauri/Cargo.toml --no-default-features --features isolated-profile
      - run: cargo test --manifest-path ../../src-tauri/Cargo.toml --features isolated-profile backend::
      - run: python3 ../../tools/native/dependencies.py
      - run: python3 -m unittest discover -s ../../tools/native -p 'test_*.py'
      # Interactive AX, VoiceOver and PostgreSQL E2E remain explicit fixture gates.
