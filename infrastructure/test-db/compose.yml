name: dbunk-test-db

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: dbunk_demo
      POSTGRES_USER: dbunk
      POSTGRES_PASSWORD: dbunk
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=en-US"
    ports:
      - "15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbunk -d dbunk_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-tls:
    build:
      context: ./postgres-tls
    profiles: ["postgres-tls"]
    environment:
      POSTGRES_DB: dbunk_demo
      POSTGRES_USER: dbunk
      POSTGRES_PASSWORD: dbunk
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=en-US"
    ports:
      - "15433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbunk -d dbunk_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: dbunk_demo
      MYSQL_USER: dbunk
      MYSQL_PASSWORD: dbunk
      MYSQL_ROOT_PASSWORD: dbunk
    ports:
      - "13306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u dbunk -pdbunk"]
      interval: 3s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_DB: dbunk_demo
      CLICKHOUSE_USER: dbunk
      CLICKHOUSE_PASSWORD: dbunk
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "18123:8123"
      - "19000:9000"
    tmpfs:
      - /var/lib/clickhouse
      - /var/log/clickhouse-server
    volumes:
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://localhost:8123/ping' | grep -q Ok",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    build:
      context: ./redis
    profiles: ["redis"]
    ports:
      - "16379:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
